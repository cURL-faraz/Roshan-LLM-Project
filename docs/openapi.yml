          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AskRequest:
      type: object
      description: Validates POST /api/ask/ input.
      properties:
        question:
          type: string
          maxLength: 2000
      required:
      - question
    Document:
      type: object
      description: API input and output for documents. Upload validation mirrors DocumentAdminForm.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
          pattern: (?:docx)$
        extracted_text:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - extracted_text
      - file
      - id
      - title
      - updated_at
    PatchedDocument:
      type: object
      description: API input and output for documents. Upload validation mirrors DocumentAdminForm.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
          pattern: (?:docx)$
        extracted_text:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    QARecord:
      type: object
      description: Response body and history items.
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
        answer:
          type: string
        sources: {}
        model_name:
          type: string
          maxLength: 255
        latency_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer
      - created_at
      - id
      - latency_ms
      - model_name
      - question
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
