services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/app/data
      - media:/app/media
      - hf_cache:/root/.cache/huggingface
volumes:
  data:
  media:
  hf_cache:
