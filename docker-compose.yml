services:
  web:
    build: .
    command: >
            sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 180 --access-logfile -"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/app/data
      - media:/app/media
      - hf_cache:/root/.cache/huggingface
volumes:
  data:
  media:
  hf_cache:
